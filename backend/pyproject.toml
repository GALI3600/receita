[project]
name = "receita-backend"
version = "0.1.0"
description = "API do Receita: transforma vídeos de receita do YouTube em receitas estruturadas"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "av<19",  # faster-whisper 1.2.1 chama av.open(metadata_errors=...), removido no av 19
    "fastapi>=0.143.0",
    "faster-whisper>=1.2.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
