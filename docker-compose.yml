x-backend: &backend
  build:
    context: ./backend
    target: dev
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    ENVIRONMENT: development
    DATABASE_URL: postgresql+asyncpg://receita:receita@db:5432/receita
    REDIS_URL: redis://redis:6379/0

x-backend-volumes: &backend-volumes
  - ./backend/app:/app/app
  - ./backend/alembic:/app/alembic

x-after-migrate: &after-migrate
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: receita
      POSTGRES_PASSWORD: receita
      POSTGRES_DB: receita
    ports:
      # Só na máquina local: o Postgres e o Redis não ficam expostos na rede.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receita"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica as migrações e sai; api e workers só sobem depois que ele termina com sucesso.
  migrate:
    <<: *backend
    command: alembic upgrade head
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes: *backend-volumes
    depends_on: *after-migrate

  # Fila padrão: metadados, legendas e Claude.
  worker:
    <<: *backend
    command: >-
      arq app.worker.WorkerSettings --custom-log-dict app.worker.LOG_CONFIG --watch app
    volumes: *backend-volumes
    depends_on: *after-migrate

  # Fila do whisper (WHISPER_MAX_JOBS por vez); o modelo é baixado uma vez para o volume.
  worker-whisper:
    <<: *backend
    command: arq app.worker.WhisperWorkerSettings --custom-log-dict app.worker.LOG_CONFIG
    volumes:
      - ./backend/app:/app/app
      - hf-cache:/root/.cache/huggingface
    depends_on: *after-migrate

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_URL: http://api:8000
      # O bind mount de /mnt/c (WSL2) não propaga eventos do inotify: o Vite observa por polling.
      VITE_USE_POLLING: "true"
      # Chave pública do Cloudflare Turnstile; vazia, o cadastro não mostra captcha.
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - api

volumes:
  pgdata:
  hf-cache:
